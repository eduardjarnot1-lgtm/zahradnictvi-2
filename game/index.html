<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#191320">
<meta name="description" content="Don't Wake Him! - a tiny stealth game about stealing one more thing before you run.">
<title>Don't Wake Him!</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0d0a10;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    overflow:hidden;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  canvas{display:block;width:100%;height:100%}

  #hud{position:absolute;left:0;top:0;right:0;padding:8px 10px;display:flex;
    align-items:center;gap:8px;font-size:13px;font-weight:700;
    background:#191320;height:40px;pointer-events:none}
  #money{color:#ffd34d;min-width:58px;font-variant-numeric:tabular-nums}
  #lvl{color:#cbbcd8;font-variant-numeric:tabular-nums}
  #noisewrap{flex:1;height:14px;border-radius:7px;background:#0006;
    border:1px solid #ffffff26;overflow:hidden;position:relative}
  #noisebar{height:100%;width:0%;background:#4cc172;transition:width .1s linear}
  #noisetxt{position:absolute;inset:0;text-align:center;font-size:10px;line-height:12px;
    text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
  .hudbtn{pointer-events:auto;background:#ffffff1a;border:1px solid #ffffff2e;color:#fff;
    border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700;line-height:1.1}
  .hudbtn:focus-visible{outline:2px solid #ffd34d;outline-offset:2px}

  #joy{position:absolute;width:110px;height:110px;border-radius:50%;
    background:#ffffff14;border:2px solid #ffffff33;display:none;pointer-events:none}
  #knob{position:absolute;width:48px;height:48px;border-radius:50%;
    background:#ffffff4d;border:2px solid #ffffff80;left:31px;top:31px}

  #take{position:absolute;right:18px;bottom:22px;width:86px;height:86px;border-radius:50%;
    background:#ffd34d1f;border:2px solid #ffd34d80;color:#ffe07a;font-size:13px;
    font-weight:800;letter-spacing:1px;display:none;align-items:center;justify-content:center;
    pointer-events:auto}
  #take.on{background:#ffd34d33;border-color:#ffd34d;color:#fff5d1}
  #take.down{transform:scale(.94);background:#ffd34d55}
  #take:focus-visible{outline:2px solid #ffd34d;outline-offset:3px}
  body[data-screen="playing"] #take{display:flex}
  /* the HUD belongs to the room, not to the menus */
  body[data-screen="menu"] #hud, body[data-screen="levels"] #hud{display:none}
  body:not([data-screen="playing"]) #btnpause{opacity:.45}

  .screen{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;
    background:#120e17f2;backdrop-filter:blur(3px)}
  .screen.on{display:flex}
  h1{font-size:30px;line-height:1.1;letter-spacing:-.5px}
  h1 small{display:block;font-size:12px;letter-spacing:3px;color:#a08fb0;
    font-weight:600;margin-bottom:6px}
  h2{font-size:24px}
  p{font-size:14px;color:#bcaec8;line-height:1.5;max-width:34ch}
  button{font:inherit;font-weight:700;cursor:pointer}
  .btn{background:#7c4dff;color:#fff;border:0;border-radius:12px;padding:13px 30px;
    font-size:16px;min-width:180px;box-shadow:0 4px 0 #4d2bb0}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #4d2bb0}
  .btn.alt{background:#ffffff1a;box-shadow:0 4px 0 #ffffff14}
  .btn.alt:active{box-shadow:0 2px 0 #ffffff14}
  .btn:focus-visible{outline:2px solid #ffd34d;outline-offset:3px}
  .btn.small{padding:9px 18px;font-size:13px;min-width:0}
  #grid{display:grid;grid-template-columns:repeat(4,58px);gap:10px;justify-content:center}
  .lv{height:58px;border-radius:12px;border:0;background:#7c4dff;color:#fff;font-size:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .lv.locked{background:#ffffff12;color:#ffffff40}
  .lv b{font-size:18px;line-height:1}
  .lv i{font-size:9px;font-style:normal;color:#ffd34d;font-weight:700}
  .stat{font-size:15px;color:#ffd34d;font-weight:700}
  .hint{font-size:12px;color:#8d7f9b}
  #crash{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;padding:20px;
    background:#1a0f12f5;color:#ffb4b4;font:12px ui-monospace,monospace;overflow:auto;z-index:9}
  #crash.on{display:flex}
  #crash pre{white-space:pre-wrap;color:#ffd9d9}
  @media (prefers-reduced-motion: reduce){ #noisebar{transition:none} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <span id="money">$0</span>
    <div id="noisewrap"><div id="noisebar"></div><div id="noisetxt">0 / 100</div></div>
    <span id="lvl">LV 1</span>
    <button id="btnmute" class="hudbtn" aria-label="Mute">🔊</button>
    <button id="btnpause" class="hudbtn" aria-label="Pause">II</button>
  </div>

  <div id="joy"><div id="knob"></div></div>
  <button id="take" aria-label="Take item">TAKE</button>

  <div class="screen on" id="scMenu">
    <h1><small>SUPER SIMPLE BETA</small>DON'T WAKE HIM!</h1>
    <p>Steal what you can. Every item makes noise. Get out before he wakes up.</p>
    <button class="btn" id="bPlay">PLAY</button>
    <button class="btn alt" id="bLevels">LEVELS</button>
    <button class="btn alt small" id="bMuteMenu">SOUND ON</button>
    <p class="stat" id="bank">Total stolen: $0</p>
    <p class="hint">Move: drag anywhere / arrows. Take: TAKE button / space.</p>
  </div>

  <div class="screen" id="scLevels">
    <h2>LEVELS</h2>
    <div id="grid"></div>
    <button class="btn alt" id="bBack">BACK</button>
    <button class="btn alt small" id="bReset">RESET PROGRESS</button>
  </div>

  <div class="screen" id="scEnd">
    <h2 id="endTitle">LEVEL COMPLETE</h2>
    <p id="endText"></p>
    <button class="btn" id="bNext">NEXT LEVEL</button>
    <button class="btn alt" id="bRetry">RETRY</button>
    <button class="btn alt" id="bMenu">MENU</button>
  </div>

  <div class="screen" id="scPause">
    <h2>PAUSED</h2>
    <button class="btn" id="bResume">RESUME</button>
    <button class="btn alt" id="bPRetry">RESTART LEVEL</button>
    <button class="btn alt" id="bPMenu">MENU</button>
  </div>

  <div id="crash">
    <b>The game hit an error and paused.</b>
    <pre id="crashText"></pre>
    <button class="btn alt small" id="bCrashReload">RESTART LEVEL</button>
  </div>
</div>

<script>
(function () {
"use strict";
var __mod = {};
__mod.tuning = (function () {
  // Every balance number in the game lives here. Nothing else defines a constant.
  // Changing balance is a data edit; a debug tuning panel only has to walk this object.
  const TUNING = {
    world: {
      width: 400,          // room coordinate space
      height: 620,
      wallThickness: 14,
      hudStrip: 40,        // reserved band above the room, in world units
      exitWidth: 80
    },

    sim: {
      hz: 60,              // fixed simulation rate; dt is always 1/hz
      maxFrameSeconds: 0.25, // longest catch-up a single rAF frame may request
      maxStepsPerFrame: 5    // spiral-of-death guard
    },

    player: {
      speed: 132,          // world units per second (top speed is unchanged)
      accel: 950,          // ~0.14s from standing to full speed: smooth, still snappy
      decel: 1250,         // stopping is a little crisper than starting
      boxWidth: 22,
      boxHeight: 24,
      maxSubStep: 4,       // swept move: never advance more than this per sub-step
      strideRate: 0.062,   // walk-cycle phase per unit travelled — ties feet to speed
      turnRate: 14         // how fast the character turns to face its heading
    },

    noise: {
      max: 100,            // he wakes at this exact value
      stirringAt: 51,      // sleeper visual stages
      almostAt: 81
    },

    pickup: {
      radius: 26,          // circular, so range is the same in every direction
      // 'action' = you must press TAKE while in range (deliberate).
      // 'auto'   = the original beta behaviour, taken on touch.
      mode: 'action',
      reachSeconds: 0.42,  // the reach-and-grab animation
      reachSlow: 0.4       // movement scale while reaching — a hesitation, not a stop
    },

    feedback: {
      // A damped thud rather than random jitter: it reads as the room reacting,
      // not as the camera malfunctioning.
      shakePerNoise: 0.16,
      shakeMax: 3.4,
      shakeDecay: 9,
      shakeHz: 13
    },

    render: {
      maxPixelRatio: 3,        // sharper on modern phones than the old cap of 2
      maxCanvasPixels: 3.2e6   // ...but never more pixels than a mid-range GPU likes
    },

    // Item value / noise table. Art for each type lives in render.js, not here:
    // the simulation must never know what an item looks like.
    items: {
      phone:  { value: 30,  noise: 8  },
      watch:  { value: 45,  noise: 10 },
      cash:   { value: 60,  noise: 12 },
      jewel:  { value: 90,  noise: 16 },
      laptop: { value: 120, noise: 22 },
      tv:     { value: 180, noise: 30 }

  };

__mod.rng = (function () {

  function createRng(seed) {
    let state = seed >>> 0;
    return {
      get seed() { return state; },
      // [0, 1)
      next() {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      range(min, max) { return min + this.next() * (max - min); },
      clone() { return createRng(state); }
    };
  }
  return { createRng };
})();
__mod.rules = (function () {
  // Pure game rules. No DOM, no canvas, no timers, no randomness.
  const { TUNING } = __mod.tuning;

  const SLEEP_ASLEEP = 0;
  const SLEEP_STIRRING = 1;
  const SLEEP_ALMOST = 2;
  const SLEEP_AWAKE = 3;

  function itemStats(type) {
    const stats = TUNING.items[type];
    if (!stats) throw new Error(`unknown item type: ${type}`);
    return stats;
  }

  function addNoise(current, amount) {
    return Math.min(TUNING.noise.max, current + amount);
  }

  function isAwake(noise) {
    return noise >= TUNING.noise.max;
  }

  function sleepStage(noise) {
    if (isAwake(noise)) return SLEEP_AWAKE;
    if (noise >= TUNING.noise.almostAt) return SLEEP_ALMOST;
    if (noise >= TUNING.noise.stirringAt) return SLEEP_STIRRING;
    return SLEEP_ASLEEP;
  }

  // Escaping is only worth anything while he is still asleep.
  function canBank(noise) {
    return !isAwake(noise);
  }

  // What a level is worth if you somehow took everything (used by the validator
  // and by balance reporting, never by the running game).
  function levelTotals(level) {
    return level.items.reduce(
      (acc, item) => {
        const stats = itemStats(item.type);
        acc.value += stats.value;
        acc.noise += stats.noise;
        return acc;
      },
      { value: 0, noise: 0 }
    );
  }

  // True when a level forces the core decision: you cannot take everything.
  function forcesChoice(level) {
    return levelTotals(level).noise > TUNING.noise.max;
  }

__mod.physics = (function () {

      box.x - box.w / 2 < c.x + c.w &&
      box.x + box.w / 2 > c.x &&
      box.y - box.h / 2 < c.y + c.h &&
      box.y + box.h / 2 > c.y

  function blocked(x, y, w, h, colliders) {
    const box = { x, y, w, h };

      if (overlaps(box, colliders[i])) return true;
    }

  }

  // position and which axes were blocked. Axis-separated inside each sub-step, so
  // sliding along a wall still works.

    const steps = Math.max(1, Math.ceil(distance / maxSubStep));
    const stepX = dx / steps;
    const stepY = dy / steps;

    let { x, y } = box;
    let hitX = false;
    let hitY = false;

    for (let i = 0; i < steps; i++) {
      if (stepX !== 0) {
        const nx = x + stepX;
        if (blocked(nx, y, box.w, box.h, colliders)) hitX = true;
        else x = nx;
      }
      if (stepY !== 0) {

__mod.levels = (function () {
  // Level data in a tagged schema. Nothing is identified by array index any more:

  // never silently shift what the renderer thinks it is looking at.

  const collider = (type, x, y, w, h) => ({ type, x, y, w, h });

  // The four room edges, with a gap left for the doorway.
  function boundary(exitX) {
    return [
      collider('wall', 0, 0, W, WT),
      collider('wall', 0, 0, WT, H),
      collider('wall', W - WT, 0, WT, H),
      collider('wall', 0, H - WT, exitX, WT),
      collider('wall', exitX + EXIT_W, H - WT, W - exitX - EXIT_W, WT)
    ];
  }

  // Three room templates. Levels vary items, not architecture.
  const LAYOUTS = {
    A: {
      bed: [145, 20, 110, 86],
      furniture: [
        [30, 180, 80, 46], [298, 190, 74, 50], [152, 306, 96, 44],
        [34, 424, 64, 62], [286, 404, 86, 46]
      ]
    },
    B: {
      bed: [24, 20, 104, 84],
      furniture: [
        [210, 54, 64, 52], [300, 158, 72, 46], [36, 224, 116, 42],
        [186, 300, 44, 116], [276, 430, 96, 44], [36, 452, 80, 42]
      ]
    },
    C: {
      bed: [262, 20, 110, 86],
      furniture: [
        [30, 44, 92, 54], [154, 152, 110, 42], [36, 262, 60, 124],
        [248, 306, 124, 42], [120, 436, 142, 42]

    }
  };

      bed,
      ...layout.furniture.map((f) => collider('furniture', ...f))

      id,
      layout: layoutKey,
      spawn: { x: spawn[0], y: spawn[1] },
      exit: { x: exitX, y: H - WT - 10, w: EXIT_W, h: WT + 18 },
      bed,
      // Where his head sits on the pillow — the renderer draws the face here.
      sleeper: { x: bed.x + bed.w / 2, y: bed.y + bed.h * 0.26 },

    makeLevel(2, 'A', [200, 540], 160, [
      [70, 140, 'watch'], [330, 140, 'phone'], [200, 250, 'cash'],

      [170, 140, 'cash'], [330, 96, 'jewel'], [60, 160, 'jewel'],
      [250, 238, 'laptop'], [120, 352, 'laptop'], [330, 352, 'jewel']
    ]),
    makeLevel(4, 'B', [200, 548], 160, [
      [172, 140, 'laptop'], [330, 96, 'cash'], [60, 162, 'watch'],
      [252, 236, 'jewel'], [112, 352, 'jewel'], [330, 352, 'laptop'],
      [66, 388, 'jewel']
    ]),
    makeLevel(5, 'C', [200, 548], 160, [
      [196, 70, 'cash'], [70, 150, 'laptop'], [330, 150, 'watch'],
      [160, 238, 'jewel'], [180, 352, 'cash'], [330, 400, 'jewel'],
      [60, 470, 'laptop']
    ]),
    makeLevel(6, 'A', [200, 540], 160, [
      [70, 120, 'jewel'], [330, 120, 'cash'], [200, 150, 'watch'],
      [200, 250, 'laptop'], [70, 352, 'cash'], [330, 340, 'jewel'],
      [200, 470, 'tv'], [340, 490, 'phone']
    ]),
    makeLevel(7, 'B', [200, 548], 160, [
      [172, 140, 'tv'], [330, 96, 'jewel'], [60, 162, 'cash'],
      [252, 236, 'laptop'], [112, 352, 'watch'], [330, 352, 'jewel'],
      [66, 392, 'cash'], [196, 496, 'laptop']
    ]),
    makeLevel(8, 'C', [200, 548], 160, [
      [196, 70, 'jewel'], [70, 150, 'tv'], [330, 150, 'cash'],
      [160, 238, 'laptop'], [186, 352, 'jewel'], [330, 400, 'laptop'],
      [60, 470, 'jewel'], [330, 520, 'jewel']
    ]),
    makeLevel(9, 'A', [200, 540], 160, [
      [70, 120, 'tv'], [330, 120, 'jewel'], [200, 150, 'cash'],
      [200, 250, 'laptop'], [70, 352, 'jewel'], [330, 340, 'laptop'],
      [200, 470, 'tv'], [340, 496, 'cash']

    makeLevel(10, 'C', [200, 548], 160, [
      [196, 70, 'tv'], [70, 150, 'jewel'], [330, 150, 'laptop'],

  // Every position the player box can legally stand in, reachable from spawn.

    const { boxWidth: PW, boxHeight: PH } = TUNING.player;

      errors.push(`spawn (${level.spawn.x},${level.spawn.y}) is inside a collider`);

    // Every item must sit in open space and be standable-next-to.

      } catch (e) {
        errors.push(`${item.id}: ${e.message}`);
        continue;

      );

          if (accumulator > STEP_SECONDS * TUNING.sim.maxStepsPerFrame) accumulator = 0;
        }
        stats.steps = steps;

        for (const pop of pops) pop.life -= elapsed * 1.2;
        pops = pops.filter((p) => p.life > 0);

        if (sim) {
          renderer.draw(sim, Math.min(1, accumulator / STEP_SECONDS), clock, pops, stats);
          paintHud();
        }
        consecutiveErrors = 0;
      } catch (error) {
        // A throw in update or draw must not kill the loop silently.
        consecutiveErrors++;
        console.error('[dwh] frame error', error);
        if (consecutiveErrors === 1) showCrash(error);
        if (consecutiveErrors > 5) {
          if (machine.is('playing')) machine.set('paused');
          consecutiveErrors = 0;
        }
      } finally {
        requestAnimationFrame(frame);
      }
    }

    function showCrash(error) {
      $('crashText').textContent = `${error && error.message}\n\n${(error && error.stack) || ''}`;
      $('crash').classList.add('on');
    }
    function hideCrash() { $('crash').classList.remove('on'); }

    // ---------------------------------------------------------------- buttons
    const on = (id, handler) => $(id).addEventListener('click', handler);
    on('bPlay', () => { audio.unlock(); startLevel(Math.min(saveStore.data.unlocked, LEVELS.length)); });
    on('bLevels', () => { audio.unlock(); audio.ui(); machine.set('levels'); });
    on('bBack', () => machine.set('menu'));
    on('bReset', () => { saveStore.reset(); buildGrid(); audio.setMuted(false); paintMute(); });
    on('bNext', () => startLevel(Math.min(currentLevelId + 1, LEVELS.length)));
    on('bRetry', () => startLevel(currentLevelId));
    on('bMenu', () => machine.set('menu'));
    on('bResume', () => machine.set('playing'));
    on('bPRetry', () => startLevel(currentLevelId));
    on('bPMenu', () => machine.set('menu'));
    on('bCrashReload', () => { hideCrash(); if (currentLevelId) startLevel(currentLevelId); });
    on('btnpause', () => {
      if (machine.is('playing')) machine.set('paused');
      else if (machine.is('paused')) machine.set('playing');
    });

    function paintMute() {
      const icon = audio.muted ? '🔇' : '🔊';
      $('btnmute').textContent = icon;
      $('bMuteMenu').textContent = `SOUND ${audio.muted ? 'OFF' : 'ON'}`;
    }
    const toggleMute = () => { audio.unlock(); audio.toggleMute(); paintMute(); };
    on('btnmute', toggleMute);
    on('bMuteMenu', toggleMute);
    paintMute();

    // The TAKE button drives the same input the keyboard does.
    takeButton.addEventListener('pointerdown', (e) => { e.preventDefault(); input.pressTake(true); });
    const releaseTake = () => input.pressTake(false);
    takeButton.addEventListener('pointerup', releaseTake);
    takeButton.addEventListener('pointercancel', releaseTake);
    takeButton.addEventListener('pointerleave', releaseTake);

    addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && machine.is('playing')) machine.set('paused');
      if (e.key.toLowerCase() === 'm') { audio.toggleMute(); paintMute(); }
      if (debug) {
        // Level jump keys: 1-9 and 0 for ten.
        if (/^[0-9]$/.test(e.key)) startLevel(e.key === '0' ? 10 : Number(e.key));
      }
    });

    const resize = () => renderer.resize(stage);
    addEventListener('resize', resize);
    addEventListener('orientationchange', () => setTimeout(resize, 200));
    resize();

    // Something must be on screen behind the menu.
    sim = createSim({ level: LEVELS[0], seed: 1 });
    requestAnimationFrame((t) => { lastTime = t; frame(t); });

    if (debug) window.__dwhBoot = { machine, saveStore, startLevel, LEVELS, TUNING };
  }
  return { boot };
})();
__mod.main.boot();
})();
</script>
</body>
